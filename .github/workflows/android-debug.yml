name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AETHER_Android_0.1.0_Source.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: write
concurrency:
  group: aether-android-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import original interface once
        run: |
          if [ -f AETHER_Android_0.1.0_Source.zip ]; then
            python3 tools/import_interface.py AETHER_Android_0.1.0_Source.zip
            node tests/host.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/web tests README.md
            git rm AETHER_Android_0.1.0_Source.zip
            git commit -m "Import original AETHER mobile interface and assets"
            git push origin HEAD:main
          fi
      - name: Validate source completeness
        run: |
          test -s app/src/main/assets/web/index.html
          test -s app/src/main/assets/web/dist/android-host.js
          test -s app/src/main/assets/web/assets/font-catalog.json
          node tests/host.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
